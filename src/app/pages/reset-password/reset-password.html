<div class="min-h-screen flex bg-slate-50">
  <div class="flex-1 flex items-center justify-center px-5 py-8 md:px-8 md:py-12">
    <div class="w-full max-w-[460px]">

      <div class="mb-6 flex flex-col items-center justify-center text-center">
        <img *ngIf="clinicSetting?.logo" [src]="clinicSetting.logo"
          class="max-h-[6rem] max-w-[12rem] object-contain rounded-lg mb-4" alt="Logo da Clínica" />
        <div *ngIf="!clinicSetting?.logo" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl text-black bg-clinic-primary shadow-md mb-4">
          <i class="fa-solid fa-key"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-800">Redefinir Senha</h2>
        <p class="text-sm text-slate-500 mt-1">Crie uma nova senha segura para acessar sua conta</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <div class="flex flex-col gap-1.5">
          <label class="text-[11.5px] font-bold text-slate-600 uppercase tracking-[0.4px]">
            Código de Verificação <span class="text-red-500">*</span>
          </label>
          <input formControlName="code" type="text"
            class="w-full bg-white border border-slate-300 rounded-lg py-2.5 px-3.5 text-sm font-medium text-black placeholder:text-slate-400 outline-none transition focus:border-clinic-primary shadow-sm tracking-widest text-center text-lg font-mono font-bold"
            [ngClass]="err('code') ? 'border-red-400 focus:border-red-400' : ''"
            placeholder="000000" maxlength="6" />
          <span class="text-[11px] text-red-500" *ngIf="err('code')">{{ err('code') }}</span>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11.5px] font-bold text-slate-600 uppercase tracking-[0.4px]">
            Nova Senha <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password"
              class="w-full bg-white border border-slate-300 rounded-lg py-2.5 pl-3.5 pr-10 text-sm font-medium text-black placeholder:text-slate-400 outline-none transition focus:border-clinic-primary shadow-sm"
              [ngClass]="err('password') ? 'border-red-400 focus:border-red-400' : ''"
              placeholder="Digite a nova senha (mínimo 8 caracteres)" />
            <button type="button" (click)="toggleShowPassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
              <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <span class="text-[11px] text-red-500" *ngIf="err('password')">{{ err('password') }}</span>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11.5px] font-bold text-slate-600 uppercase tracking-[0.4px]">
            Confirmar Nova Senha <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input formControlName="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'" autocomplete="new-password"
              class="w-full bg-white border border-slate-300 rounded-lg py-2.5 pl-3.5 pr-10 text-sm font-medium text-black placeholder:text-slate-400 outline-none transition focus:border-clinic-primary shadow-sm"
              [ngClass]="err('confirmPassword') ? 'border-red-400 focus:border-red-400' : ''"
              placeholder="Repita a nova senha" />
            <button type="button" (click)="toggleShowConfirmPassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
              <i class="fa-solid" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <span class="text-[11px] text-red-500" *ngIf="err('confirmPassword')">{{ err('confirmPassword') }}</span>
        </div>

        <div class="mt-2">
          <button type="submit" [disabled]="isLoading"
            class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg text-sm font-bold text-black cursor-pointer transition hover:-translate-y-px hover:shadow-[0_4px_12px_rgba(0,0,0,0.25)] bg-clinic-primary disabled:opacity-55 disabled:cursor-not-allowed disabled:transform-none">
            <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
            <i class="fa-solid fa-check" *ngIf="!isLoading"></i>
            <span>{{ isLoading ? 'Redefinindo...' : 'Salvar Nova Senha' }}</span>
          </button>
        </div>

      </form>

      <div class="flex flex-col items-center gap-3 mt-8 pt-6 border-t border-slate-200">
        <p class="text-center text-[13px] text-slate-500">
          Lembrou a senha?
          <a routerLink="/login" class="font-semibold no-underline hover:underline text-clinic-primary">
            Fazer Login
          </a>
        </p>
        <p class="text-center text-[13px] text-slate-500">
          Não tem o código?
          <a routerLink="/forgot-password" class="font-semibold no-underline hover:underline text-clinic-primary">
            Solicitar Novamente
          </a>
        </p>
      </div>

    </div>
  </div>
</div>
