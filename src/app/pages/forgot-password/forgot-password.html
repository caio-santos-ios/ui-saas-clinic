<div class="min-h-screen flex bg-slate-50">
  <div class="flex-1 flex items-center justify-center px-5 py-8 md:px-8 md:py-12">
    <div class="w-full max-w-[460px]">

      <div class="mb-8 flex items-center justify-center">
        <img *ngIf="clinicSetting?.logo" [src]="clinicSetting.logo"
          class="max-h-[10rem] max-w-[10rem] object-contain rounded-lg" alt="Logo da Clínica" />
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <div class="flex flex-col gap-1.5">
          <label class="text-[11.5px] font-bold text-slate-600 uppercase tracking-[0.4px]">
            E-mail <span class="text-red-500">*</span>
          </label>
          <input formControlName="email" type="email" autocomplete="email"
            class="w-full bg-white border border-slate-300 rounded-lg py-2.5 px-3.5 text-sm font-medium text-black placeholder:text-slate-400 outline-none transition focus:border-clinic-primary focus:ring-2 focus:ring-clinic-primary/20 shadow-sm"
            [ngClass]="err('email') ? 'border-red-400 focus:border-red-400 focus:ring-red-400/20' : ''"
            placeholder="exemplo@clinica.com.br" />
          <span class="text-[11px] text-red-500" *ngIf="err('email')">{{ err('email') }}</span>
        </div>

        <div class="mt-2">
          <button type="submit" [disabled]="isLoading"
            class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg text-sm font-bold text-black cursor-pointer transition hover:-translate-y-px hover:shadow-[0_4px_12px_rgba(0,0,0,0.25)] bg-clinic-primary disabled:opacity-55 disabled:cursor-not-allowed disabled:transform-none">
            <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
            <i class="fa-solid fa-right-to-bracket" *ngIf="!isLoading"></i>
            <span>{{ isLoading ? 'Carregando...' : 'Resetar' }}</span>
          </button>
        </div>

      </form>

      <div class="flex flex-col items-center gap-4 mt-8 pt-6 border-t border-slate-200">
        <p class="text-center text-[13px] text-slate-500">
          Já tem a senha?
          <a routerLink="/login" class="font-semibold no-underline hover:underline text-clinic-primary">
            Fazer Login
          </a>
        </p>
      </div>

    </div>
  </div>
</div>
