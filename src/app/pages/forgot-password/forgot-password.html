<div class="min-h-screen flex bg-slate-50 dark:bg-[#080d1a] text-slate-900 dark:text-slate-100 transition-colors relative">

  <button type="button" (click)="themeService.toggleTheme()"
    class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full flex items-center justify-center text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100 bg-white/80 dark:bg-slate-800/80 backdrop-blur border border-slate-200 dark:border-slate-700 shadow-sm transition hover:scale-105 cursor-pointer"
    [title]="themeService.isDark() ? 'Mudar para modo claro' : 'Mudar para modo escuro'">
    <i class="fa-solid" [ngClass]="themeService.isDark() ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'"></i>
  </button>

  <div class="flex-1 flex items-center justify-center px-5 py-8 md:px-8 md:py-12">
    <div class="w-full max-w-[460px]">

      <div class="mb-8 flex flex-col items-center justify-center text-center">
        <img *ngIf="clinicSetting?.logo" [src]="clinicSetting.logo"
          class="max-h-[6rem] max-w-[12rem] object-contain rounded-lg mb-4" alt="Logo da Clínica" />
        <div *ngIf="!clinicSetting?.logo" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl text-black bg-clinic-primary shadow-md mb-4">
          <i class="fa-solid fa-unlock-keyhole"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 dark:text-slate-100 mb-1">Recuperar Senha</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Informe o e-mail cadastrado para receber o código de recuperação</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <div class="flex flex-col gap-1.5">
          <label class="text-[11.5px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-[0.4px]">
            E-mail <span class="text-red-500">*</span>
          </label>
          <input formControlName="email" type="email" autocomplete="email"
            class="w-full bg-white dark:bg-[#0b1120] border border-slate-300 dark:border-slate-700 rounded-lg py-2.5 px-3.5 text-sm font-medium text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 outline-none transition focus:border-clinic-primary shadow-sm"
            [ngClass]="err('email') ? 'border-red-400 focus:border-red-400' : ''"
            placeholder="exemplo@clinica.com.br" />
          <span class="text-[11px] text-red-500" *ngIf="err('email')">{{ err('email') }}</span>
        </div>

        <div class="mt-2">
          <button type="submit" [disabled]="isLoading"
            class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg text-sm font-bold text-black cursor-pointer transition hover:-translate-y-px hover:shadow-[0_4px_12px_rgba(0,0,0,0.25)] bg-clinic-primary disabled:opacity-55 disabled:cursor-not-allowed disabled:transform-none">
            <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
            <i class="fa-solid fa-paper-plane" *ngIf="!isLoading"></i>
            <span>{{ isLoading ? 'Enviando...' : 'Enviar Código' }}</span>
          </button>
        </div>

      </form>

      <div class="flex flex-col items-center gap-4 mt-8 pt-6 border-t border-slate-200 dark:border-slate-800">
        <p class="text-center text-[13px] text-slate-500 dark:text-slate-400">
          Lembrou sua senha?
          <a routerLink="/login" class="font-semibold no-underline hover:underline text-clinic-primary">
            Fazer Login
          </a>
        </p>
      </div>

    </div>
  </div>
</div>
