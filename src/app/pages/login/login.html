<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Saas Clinica</h1>
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email">E-mail Administrativo</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="admin@boratrampar.com"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Senha de Acesso</label>
            <a routerLink="/reset-password" class="forgot-link">Esqueceu a senha?</a>
          </div>
          <div class="password-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              class="form-control"
              placeholder="Digite sua senha segura"
              [(ngModel)]="password"
              name="password"
              required
            />
            <button
              type="button"
              class="btn-toggle-pwd"
              (click)="toggleShowPassword()"
            >
              <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-submit" [disabled]="isLoading">
          <i class="fa-solid fa-right-to-bracket" *ngIf="!isLoading"></i>
          <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
          <span>{{ isLoading ? 'Entrando...' : 'Acessar Painel' }}</span>
        </button>
      </form>

      <div class="auth-footer">
        <span class="security-badge">
          <i class="fa-solid fa-lock"></i> Conexão Segura & Criptografada
        </span>
      </div>
    </div>
  </div>
</div>
